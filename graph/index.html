<script src="https://unpkg.com/force-graph"></script>

<style>
  .page {
    max-width: none !important;
  }

  #graph-container {
    width: 100vw;
    height: 100vh;
    margin-left: calc(-50vw + 50%);
    margin-top: -5%;
    border: none;
    position: relative;
    overflow: hidden;
  }
</style>

<div id="graph-container"></div>

<script>
let FULL_DATA = null;
let graph = null;


function getNodeId(x) {
  return (typeof x === "object" && x !== null) ? x.id : x;
}

document.addEventListener("DOMContentLoaded", () => {
  setTimeout(() => {
    fetch("index.json")
      .then(r => r.json())
      .then(data => {
        
        const degree = {};
        data.links.forEach(l => {
          degree[l.source] = (degree[l.source] || 0) + 1;
          degree[l.target] = (degree[l.target] || 0) + 1;
        });

        const nodes = data.nodes.filter(n => (degree[n.id] || 0) >= 1);
        const ids = new Set(nodes.map(n => n.id));
        const links = data.links.filter(
          l => ids.has(l.source) && ids.has(l.target)
        );

        FULL_DATA = { nodes, links };
FULL_DATA.nodes.forEach(n => {
  n.x = (Math.random() - 0.5) * 3000;   
  n.y = (Math.random() - 0.5) * 3000;   
});
        
        graph = ForceGraph()(document.getElementById("graph-container"))
          .graphData(FULL_DATA)

          
          

          
          .nodeRelSize(1)
          .nodeVal(n =>
            n.__hovered ? 18 : (n.type === "page" ? 10 : 8)
          )

          
          .nodeAutoColorBy("type")

          
          .nodeCanvasObjectMode(() => 'after')
          .nodeCanvasObject((node, ctx) => {
            if (node.x == null || node.y == null) return;

            const label = node.label || "";
            if (!label) return;

            const fontSize = node.__hovered ? 16 : 8;
            ctx.font = `${fontSize}px Sans-Serif`;
            ctx.fillStyle = node.__hovered
              ? "#ffffff"
              : "rgba(255,255,255,0.35)";
            ctx.textAlign = "center";
            ctx.textBaseline = "top";

            
            ctx.fillText(label, node.x, node.y + 4);
          })

          
          .onNodeHover(node => {
            FULL_DATA.nodes.forEach(n => n.__hovered = false);
            FULL_DATA.links.forEach(l => l.__highlight = false);
            

            if (node) {
              node.__hovered = true;

              FULL_DATA.links.forEach(l => {
                const s = getNodeId(l.source);
                const t = getNodeId(l.target);
                if (s === node.id || t === node.id) {
                  l.__highlight = true;
                }
              });
            }

            graph.nodeVal(graph.nodeVal()); 
            graph.linkWidth(l => (l.__highlight ? 1.2 : 0.3));
            graph.linkColor(l =>
              l.__highlight ? "#ffb347" : "rgba(255,255,255,0.15)"
            );
          })

          
          .linkWidth(() => 0.3)
          .linkColor(() => "rgba(255,255,255,0.15)")

          
          .onNodeClick(node => {
              
              if (node.type === "page" && node.url) {
                window.location.href = node.url;
                return;
              }

              
              if (node.type === "tag") {
                const slug = node.id.replace(/^tag-/, "");  
                window.location.href = "/tags/" + slug + "/";
                return;
              }
            })

          
          .zoom(2.5)
      })
      .catch(err => console.error("Graph JSON error:", err));
  }, 50);
});
</script>
